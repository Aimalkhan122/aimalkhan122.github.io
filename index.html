<!DOCTYPE html>
<html>
<head>
    <title>وب‌سایت من</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        /* منو بالا */
        .menu {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        .menu a:hover {
            color: #ffcc00;
        }

        /* بخش اصلی */
        .container {
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #0066cc;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        /* دکمه */
        .btn {
            background-color: #0066cc;
            color: white;
            padding: 12px 25px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #004999;
        }
    </style>
</head>

<body>

    <!-- منو -->
    <div class="menu">
        <a href="#">خانه</a>
        <a href="#">درباره ما</a>
        <a href="#">خدمات</a>
        <a href="#">تماس</a>
    </div>

    <!-- محتوا -->
    <div class="container">
        <h1>به وب‌سایت من خوش آمدید</h1>
        <p>این یک وب‌سایت نمونه است که من خودم با کُدنویسی ساختم.</p>

        <button class="btn">کلیک کن</button>
    </div>

</body>
</html>
