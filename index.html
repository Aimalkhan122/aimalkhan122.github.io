<!DOCTYPE html>
<html>
<head>
    <title>وب‌سایت من</title>
<link rel="stylesheet" href="style.css">
</head>
<script>
const sections = document.querySelectorAll("section");

window.addEventListener("scroll", () => {
    sections.forEach(sec => {
        const top = sec.getBoundingClientRect().top;
        if (top < window.innerHeight - 100) {
            sec.classList.add("show");
        }
    });
});
</script>
<body>

<!-- منوی بالا -->
<nav>
    <a href="index.html">خانه</a>
    <a href="about.html">درباره ما</a>
    <a href="contact.html">تماس</a>
<button onclick="toggleDark()" class="btn">🌙</button>

</nav>

<!-- محتوای صفحه اصلی -->
<section>
    <h1>به وب‌سایت من خوش آمدید</h1>
    <p>این وب‌سایت را من از صفر تا این‌جا خودم ساختم.</p>

    <button class="btn" onclick="showMessage()">
        کلیک کن
    </button>
</section>
function toggleDark() {
    document.body.classList.toggle("dark");
}
<script>
    function showMessage() {
        alert("🎉 تبریک! دکمه به‌درستی کار می‌کند");
    }
</script>

</body>
</html>
